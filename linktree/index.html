<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;background:#1c1c1c}
body{min-height:100%;background:#1c1c1c;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:16px;line-height:1.4;display:flex;flex-direction:column;align-items:center;padding:0 0 56px}
.wrap{width:100%;max-width:580px;padding:0 18px}

/* header photo */
.hero{width:100%;border-radius:14px;overflow:hidden;margin-top:18px;background:#000}
.hero img{width:100%;height:auto;display:block}

.handle{text-align:center;font-size:24px;font-weight:700;margin-top:16px;letter-spacing:.01em}
.tagline{text-align:center;font-size:15px;color:#d8d8d8;margin-top:6px;line-height:1.5;padding:0 6px}

/* language toggle */
.lang-toggle{display:flex;justify-content:center;gap:6px;margin:16px 0 4px}
.lang-btn{padding:7px 18px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#cfcfcf;cursor:pointer;border-radius:22px;font-size:13px;font-weight:700;font-family:inherit;letter-spacing:.08em;-webkit-tap-highlight-color:transparent;min-height:36px;transition:all .15s}
.lang-btn.active{background:#fff;color:#1c1c1c;border-color:#fff}

.socials{display:flex;justify-content:center;gap:22px;margin:16px 0 4px}
.socials a{color:#fff;display:flex;-webkit-tap-highlight-color:transparent}
.socials svg{width:24px;height:24px;fill:currentColor}

/* section heading — matches the uppercase condensed headers on the live page */
.sec-hd{text-align:center;font-size:15px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#fff;margin:30px 0 12px}

/* white pill card — the live page's look */
.lnk{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px 44px;background:#fff;border-radius:11px;color:#1c1c1c;text-decoration:none;font-size:16px;font-weight:600;text-align:center;margin-bottom:13px;min-height:58px;transition:transform .12s;-webkit-tap-highlight-color:transparent;position:relative}
.lnk:hover{transform:scale(1.015)}
.lnk-ic{width:26px;height:26px;border-radius:5px;object-fit:cover;position:absolute;left:14px;top:50%;transform:translateY(-50%)}
.lnk-sub{display:block;font-size:13px;font-weight:500;color:#666;margin-top:2px}

/* image card (3ForJesus) */
.card-img{display:block;width:100%;background:#fff;border-radius:11px;overflow:hidden;text-decoration:none;color:#1c1c1c;margin-bottom:13px;transition:transform .12s}
.card-img:hover{transform:scale(1.015)}
.card-img img{width:100%;height:auto;display:block}
.card-img span{display:block;text-align:center;font-size:16px;font-weight:600;padding:15px 12px}

.ft{margin-top:26px;font-size:13px;color:#7d7d7d;text-align:center;line-height:1.6}

<script>
(function(){
  var S = {
    PT: {
      tagline:'Seja bem-vindo a Lagoinha Tampa. Estamos muito felizes em ter voce conosco!',
      hdVisit:'Venha nos fazer uma visita',
      tFirst:'Primeira vez? First Visit?', tCampus:'CAMPUS 1', tCultos:'CULTOS DE CELEBRACAO',
      hdConnect:'Bem vindo!',
      tGroups:'NAO FIQUE SOZINHO! — Encontre um GC', tMembros:'Cafe de Novos Membros',
      t3FJ:'CADASTRE SEUS 3ForJesus',
      hdSteps:'Inscricoes',
      tBat:'BATISMO', tCons:'CONSAGRACAO DE CRIANCAS',
      hdApp:'Baixe nosso aplicativo', tApple:'APPLE — App Store', tAndroid:'ANDROID — Google Play',
      hdGive:'Faca sua parte', tApp:'LTC APP',
      hdWatch:'Redes sociais', tShare:'Compartilhe no WhatsApp',
      ft:'Lagoinha Tampa Church'
    },
    EN: {
      tagline:'Welcome to Lagoinha Tampa. We are so glad to have you with us!',
      hdVisit:'Come visit us',
      tFirst:'First time here?', tCampus:'CAMPUS 1 — Directions', tCultos:'CELEBRATION SERVICES',
      hdConnect:'Welcome!',
      tGroups:"DON'T DO LIFE ALONE — Find a small group", tMembros:'New Members Coffee',
      t3FJ:'SIGN UP FOR 3ForJesus',
      hdSteps:'Sign-ups',
      tBat:'BAPTISM', tCons:'CHILD DEDICATION',
      hdApp:'Download our app', tApple:'APPLE — App Store', tAndroid:'ANDROID — Google Play',
      hdGive:'Give', tApp:'LTC APP',
      hdWatch:'Social media', tShare:'Share on WhatsApp',
      ft:'Lagoinha Tampa Church'
    },
    ES: {
      tagline:'Bienvenido a Lagoinha Tampa. Estamos muy felices de tenerte con nosotros!',
      hdVisit:'Ven a visitarnos',
      tFirst:'Primera vez aqui?', tCampus:'CAMPUS 1 — Como llegar', tCultos:'CULTOS DE CELEBRACION',
      hdConnect:'Bienvenido!',
      tGroups:'NO ESTES SOLO — Encuentra un grupo', tMembros:'Cafe de Nuevos Miembros',
      t3FJ:'REGISTRA TUS 3ForJesus',
      hdSteps:'Inscripciones',
      tBat:'BAUTISMO', tCons:'CONSAGRACION DE NINOS',
      hdApp:'Descarga nuestra app', tApple:'APPLE — App Store', tAndroid:'ANDROID — Google Play',
      hdGive:'Haz tu parte', tApp:'LTC APP',
      hdWatch:'Redes sociales', tShare:'Comparte en WhatsApp',
      ft:'Lagoinha Tampa Church'
    }
  };

  var KEYS = ['tagline','hdVisit','tFirst','tCampus','tCultos','hdConnect','tGroups','tMembros',
    't3FJ','hdSteps','tBat','tCons','hdApp','tApple','tAndroid','hdGive','tApp','hdWatch','tShare','ft'];

  function setLang(l){
    var s = S[l];
    for (var i=0;i<KEYS.length;i++){
      var el = document.getElementById(KEYS[i]);
      if (el) el.textContent = s[KEYS[i]];
    }
    document.documentElement.lang = (l==='PT'?'pt':l==='EN'?'en':'es');

    // Carry the visitor's language choice into the JotForms. Those forms are
    // already translated PT/EN/ES and read the language from the URL, so
    // someone who picked English here opens the form in English instead of
    // landing on the Portuguese default and hunting for a dropdown.
    //
    // The parameter is ?language=, NOT ?lang=. Verified 2026-09-14 on
    // cookie-free tabs for all three values, including through the
    // lagoinhatampa.com -> form.jotform.com redirect, which preserves the
    // query string. ?lang= is silently ignored and the form falls back to
    // Portuguese - and JotForm also stores a savedUserLanguage cookie that
    // overrides the default once set, which makes ?lang= look like it works
    // if you have visited the form in another language first. Test this in a
    // cookie-free tab or you will measure your own cookie.
    //
    // Does NOT apply to the InPeace links (batismo, consagracao, groups,
    // give) - those are hardcoded pt_BR with no language control at all.
    var jfLang = (l==='PT'?'pt':l==='EN'?'en':'es');
    var jfLinks = document.querySelectorAll('a.jf');
    for (var j=0;j<jfLinks.length;j++){
      var base = jfLinks[j].getAttribute('data-base');
      jfLinks[j].setAttribute('href', base + (base.indexOf('?')===-1?'?':'&') + 'language=' + jfLang);
    }
    document.getElementById('btnPT').classList.toggle('active', l==='PT');
    document.getElementById('btnEN').classList.toggle('active', l==='EN');
    document.getElementById('btnES').classList.toggle('active', l==='ES');
    try { localStorage.setItem('ltcLang', l); } catch(e){}
  }

  document.getElementById('btnPT').addEventListener('click', function(){ setLang('PT'); });
  document.getElementById('btnEN').addEventListener('click', function(){ setLang('EN'); });
  document.getElementById('btnES').addEventListener('click', function(){ setLang('ES'); });

  var saved = null;
  try { saved = localStorage.getItem('ltcLang'); } catch(e){}
  setLang(saved || 'PT');
})();
</script>
